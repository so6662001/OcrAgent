server:
  port: 8080

spring:
  application:
    name: ocr-demo
  profiles:
    active: h2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

demo:
  jwt:
    secret: ocr-demo-secret-key-for-jwt-token-generation-2026
    expiration: 86400000

ocr:
  default-threshold: 95.0
  max-upload-files: 50
  max-file-size: 20971520
  default-retain-days: 365
  baidu:
    app-id: ${BAIDU_OCR_APP_ID:}
    api-key: ${BAIDU_OCR_API_KEY:}
    secret-key: ${BAIDU_OCR_SECRET_KEY:}
    qps-limit: 10
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ocr-files

logging:
  level:
    com.ocr: DEBUG
    org.springframework.security: WARN
